<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <line x1="80" y1="500" x2="720" y2="500" stroke="#64748B" stroke-width="3"/>
  <!-- Slicer Base -->
  <path d="M180 480 L610 480 L575 375 L215 375 Z" fill="#E2E8F0" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <!-- Rubber Feet -->
  <rect x="210" y="480" width="36" height="20" rx="4" fill="#0F172A"/>
  <rect x="545" y="480" width="36" height="20" rx="4" fill="#0F172A"/>
  <!-- Circular Blade 300mm -->
  <circle cx="445" cy="270" r="120" fill="url(#blade)" stroke="#475569" stroke-width="5"/>
  <circle cx="445" cy="270" r="32" fill="#334155"/>
  <!-- Carriage & Meat Holder -->
  <polygon points="240,375 380,375 340,210 215,245" fill="#CBD5E1" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <!-- Control Knob & Switch -->
  <circle cx="275" cy="430" r="24" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <rect x="335" y="415" width="55" height="30" rx="4" fill="#DC2626"/>
  <text x="400" y="75" font-family="sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">AÇOUGUE, FRIOS &amp; PROCESSAMENTO</text>
  <text x="400" y="102" font-family="monospace" font-size="14" fill="#475569" text-anchor="middle">LÂMINA EM AÇO INOX TEMPERADO · NORMA NR12 · ALTA PRECISÃO</text>
</svg>
