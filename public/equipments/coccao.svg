  <line x1="125" y1="248" x2="675" y2="248" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <circle cx="185" cy="248" r="11" fill="#DC2626" stroke="#0F172A" stroke-width="2"/>
  <circle cx="255" cy="248" r="11" fill="#DC2626" stroke="#0F172A" stroke-width="2"/>
  <circle cx="365" cy="248" r="11" fill="#DC2626" stroke="#0F172A" stroke-width="2"/>
  <circle cx="435" cy="248" r="11" fill="#DC2626" stroke="#0F172A" stroke-width="2"/>
  <circle cx="545" cy="248" r="11" fill="#DC2626" stroke="#0F172A" stroke-width="2"/>
  <circle cx="615" cy="248" r="11" fill="#DC2626" stroke="#0F172A" stroke-width="2"/>
  <text x="400" y="75" font-family="sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">COCÇÃO INDUSTRIAL · FOGÕES, CHAPAS &amp; FORNOS</text>
  <text x="400" y="102" font-family="monospace" font-size="14" fill="#475569" text-anchor="middle">QUEIMADORES DUPLOS EM FERRO FUNDIDO · ESTRUTURA REFORÇADA</text>
